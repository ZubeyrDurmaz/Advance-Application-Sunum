<div class="cancel-container">
  <div class="cancel-content">
    <div class="cancel-card">
      <div class="cancel-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      
      <h1>Payment Cancelled</h1>
      <p class="cancel-message">
        Your payment was cancelled. No charges have been made to your account.
      </p>
      
      <div class="action-buttons">
        <button (click)="goToCheckout()" class="btn-primary">
          Try Again
        </button>
        <button (click)="goToCart()" class="btn-secondary">
          Return to Cart
        </button>
      </div>
      
      <button (click)="goToCollection()" class="btn-link">
        Continue Shopping
      </button>
      
      <div class="info-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
        <p>If you experienced any issues during checkout, please contact our support team.</p>
      </div>
    </div>
  </div>
</div>
