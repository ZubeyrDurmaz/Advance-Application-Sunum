spring.application.name=backend

# ── Database ──
# Set these environment variables or use .env file
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/watch_store_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 Database (Local Testing) - Commented out
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT ──
# Set these environment variables or use .env file
app.jwt.secret=${JWT_SECRET:ChronosSecretKeyForJWTTokenGeneration2024MustBeLongEnoughForHS512Algorithm!!}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# ── Server ──
server.port=8080

# ── Stripe ──
# Set these environment variables or use .env file
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# ── Anthropic AI ──
# Set this to enable Claude API integration. Leave empty to use smart fallback mode.
anthropic.api.key=
